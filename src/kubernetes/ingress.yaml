apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  # Replaces the deprecated kubernetes.io/ingress.class annotation;
  # both cannot be set at the same time.
  ingressClassName: nginx
  rules:
    - host: cinemaabyss.127.0.0.1.nip.io
      http:
        paths:
          # Everything goes through the proxy (API Gateway, Strangler Fig)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 80
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082
